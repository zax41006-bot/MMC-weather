name: Update 15-Day Forecast

on:
  schedule:
    # 澳門時間 05:15 (UTC 前一日 21:15)
    - cron: '15 21 * * *'
    # 澳門時間 17:15 (UTC 09:15)
    - cron: '15 9 * * *'
  workflow_dispatch: # 手動按鈕

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Chinese fonts
        run: |
          # 安裝中文字體
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          
          # 【最關鍵】清除字體緩存，強迫系統識別新安裝的中文字體
          rm -rf ~/.cache/matplotlib
          
          # 安裝依賴
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib scipy

      - name: Run 15-day forecast script
        run: python forecast15d.py 

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add forecast15d.png
          
          # 防止衝突，提交並推送
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 15-day forecast image [skip ci]" && git pull --rebase && git push)
