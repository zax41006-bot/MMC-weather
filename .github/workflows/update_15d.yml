name: Update 15-Day Forecast

on:
  schedule:
    # 澳門時間 05:15 (UTC 前一日 21:15) - 錯開整點避免伺服器塞車
    - cron: '15 21 * * *'
    # 澳門時間 17:15 (UTC 09:15)
    - cron: '15 9 * * *'
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊運行測試

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    # 賦予寫入權限，才能將生成的圖片 commit 回倉庫
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 使用穩定的 Python 版本

      - name: Install dependencies and Chinese fonts
        run: |
          # 更新 apt 並安裝文泉驛中文字體，解決圖片中文變方塊的問題
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          
          # 安裝 Python 依賴包
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib scipy

      - name: Run 15-day forecast script
        run: python forecast15d.py # 執行你的 15 天預報腳本

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 只將生成的圖片加入暫存區
          git add forecast15d.png
          
          # 檢查是否有變動，如果有才進行 commit 和 push
          # 加入 git pull --rebase 防止與其他 Action 的提交發生衝突
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 15-day forecast image [skip ci]" && git pull --rebase && git push)
