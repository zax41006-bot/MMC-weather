name: Update MMC Weather Image

on:
  schedule:
    # 每 15 分鐘檢查一次
    - cron: '*/15 * * * *'
  workflow_dispatch: # 讓你能在網頁上手動點擊測試

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Linux 系統中文字體
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --index-url https://pypi.tuna.tsinghua.edu.cn/simple/

      - name: 執行 real-time.py 生成天氣圖片
        run: python real-time.py

      - name: 提交並推送圖片回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull origin main
          
          # 只把圖片加入
          git add weather.png
          
          # 🌟 關鍵：Git 會自動比對。如果圖片一模一樣，這行就不會 Commit；如果圖片變了，才會 Commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather image [skip ci]" && git push)
