name: Update MMC Weather Image

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 稍微拉長一點時間，因為要跑兩個腳本

    steps:
      - name: 檢出代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Linux 系統中文字體
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --index-url https://pypi.tuna.tsinghua.edu.cn/simple/

      - name: 執行 real-time.py 生成實時簡報
        run: python real-time.py

      - name: 執行 forecast48h.py 生成 48 小時預報
        run: python forecast48h.py

      - name: 提交並推送圖片回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull origin main -X ours
          
          # 🌟 把兩張圖片都加入
          git add weather.png forecast48h.png
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather images [skip ci]" && git push)
