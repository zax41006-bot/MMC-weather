name: Update MMC Weather Image

on:
  # 🌟 移除 GitHub 原生的 schedule，完全交由 cron-job.org 準時觸發
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 檢出代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝 Linux 系統中文字體
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --index-url https://pypi.tuna.tsinghua.edu.cn/simple/

      - name: 執行 real-time.py 生成天氣圖片
        run: python real-time.py

      - name: 提交並推送圖片回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # 1. 先把新畫好的圖片加入並提交
          git add weather.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather image [skip ci]")
          
          # 2. 再拉取遠端代碼，如果圖片有衝突，以本地剛畫好的為主 (-X ours)
          git pull origin main -X ours
          
          # 3. 推送到 GitHub
          git push origin main
