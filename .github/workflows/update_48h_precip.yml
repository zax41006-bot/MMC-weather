name: Update 48h Precipitation Maps

on:
  schedule:
    # 澳門時間 05:15 (UTC 21:15) - 觸發 12Z
    - cron: '15 21 * * *'
    # 澳門時間 17:15 (UTC 09:15) - 觸發 00Z
    - cron: '15 9 * * *'
  workflow_dispatch: # 允許手動測試

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          rm -rf ~/.cache/matplotlib
          
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib scipy xarray herbie-data cfgrib eccodes cartopy

      - name: Run 48h precipitation script
        run: python generate_48h_precip.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 檢查是否有生成任何圖片
          if ls precip_48h_*.png 1> /dev/null 2>&1; then
              git add precip_48h_*.png
              if git diff --staged --quiet; then
                  echo "No changes in images to commit."
              else
                  git commit -m "Auto-update 48h precipitation maps [skip ci]"
                  git pull --rebase
                  git push
              fi
          else
              echo "No images were generated. Skipping commit step."
          fi
