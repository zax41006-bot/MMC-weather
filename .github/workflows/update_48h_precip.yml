name: Update 48h Precipitation Maps

on:
  schedule:
    # UTC 21:15 (Macau Time 05:15) - Triggers 12Z
    - cron: '15 21 * * *'
    # UTC 09:15 (Macau Time 17:15) - Triggers 00Z
    - cron: '15 9 * * *'
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          rm -rf ~/.cache/matplotlib
          
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib scipy xarray herbie-data cfgrib eccodes cartopy

      - name: Run 48h precipitation script
        run: python generate_48h_precip.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add precip_48h_*.png
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 48h precipitation maps [skip ci]" && git pull --rebase && git push)
